<!DOCTYPE html>
<html lang="es-MX">
<head>
  <!--
    `flutter build web --base-href /ruta/` reemplaza este valor cuando la app
    no se sirve desde la raíz del dominio. Debe iniciar y terminar con "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Gestopago: consulta tus cuentas y paga servicios con autorización de doble factor.">
  <meta name="theme-color" content="#173B2D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gestopago">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gestopago</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Mismo fondo que la app para evitar un destello blanco al cargar. */
    html, body { margin: 0; background: #F6F0E5; }
    html {
      /* Sin destello gris/azul al tocar en iOS y Android: la app da su propio
         feedback al presionar. */
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      /* Evita que "jalar para recargar" del navegador secuestre el scroll
         de la app, que ya tiene su propio RefreshIndicator. */
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
