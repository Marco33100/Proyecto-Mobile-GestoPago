plugins {
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'org.springframework.boot' version '3.3.6'//Versión de componentes de spring boot
    id 'org.sonarqube' version '4.0.0.2929'
    id "org.owasp.dependencycheck" version "8.1.2"
    id 'com.github.ben-manes.versions' version '0.46.0'
    id 'java'
}

group = 'com.proyecto.servicio.empresa'
version = '1.0'

java{
    sourceCompatibility=17
    targetCompatibility=17
}

repositories {
    mavenCentral()
}


dependencies {
    //Spring Framework
    implementation 'org.springframework.cloud:spring-cloud-config-client:4.1.4'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.4'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    //Documentation y APIs

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0' //RevisarCompatibilidad
    //Bases de datos
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // implementation 'org.hibernate:hibernate-core:6.2.7.Final'
    implementation 'org.hibernate:hibernate-core:6.5.3.Final'
    //Seguridad
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    //Utilerias Apache Commons
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    //implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    // Mantener HttpClient y HttpCore en las versiones compatibles administradas por Spring Boot.
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    //Soporte adicional  herramientas de desarrollo
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-inline:5.1.1'
    testImplementation 'com.h2database:h2:2.2.220'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.all {
    exclude group: "commons-logging", module: "commons-logging"
    exclude group: "org.apache.logging.log4j", module: "log4j-api"
    exclude group: "org.apache.logging.log4j", module: "log4j-to-slf4j"
    exclude group: "log4j", module: "log4j"
}

test {
    useJUnitPlatform()
}

springBoot {
    buildInfo {
    }
}

sonarqube {
    properties {
        property "sonar.exclusions", "**/App.java,**/model/**,**/entity/**,**/enums/**,**/config/**,**/controller/**,**/service/configuracion/**,**/GeneratedPluginRegistrant.java,**/ios/Flutter/ephemeral/flutter_lldb_helper.py,**/service/JwtTokenService.java,**/service/Impl/TotpCodes.java"
    }
}
jacocoTestReport {
    reports {
        xml.required=true
    }
}

//ejecutar applicación dentro de contenedor
//sh gradlew clean build dockerImage dockerUp
/**
 * Genera imagen
 */
task dockerImage(type: Exec) {
    doFirst {
        println 'CrearImagen'
    }
    commandLine "docker", "build", "-t", "proyecto-core:0.1", "$projectDir"
}

/**
 * Ejecuta imagen
 */
task dockerUp(type: Exec) {
    doFirst {
        println "Arranca imagen"
    }
    commandLine "docker-compose", "--compatibility", "up"
}

dependencyCheck {
    formats = ["JSON", "HTML"]
}
