spring.application.name=prueba
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:}
spring.cloud.config.enabled=${SPRING_CLOUD_CONFIG_ENABLED:false}
debug=false
spring.devtools.add-properties=false
logging.level.org.springframework.web=INFO
spring.freemarker.check-template-location=false

# Base de datos PostgreSQL local. La contrasena se proporciona mediante variable de entorno.
app.database.enabled=${APP_DATABASE_ENABLED:false}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Database-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_READ_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
gestopago.auth.enabled=${GESTOPAGO_AUTH_ENABLED:false}
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}

# Integracion de catalogo Gestopago. Los secretos se reciben desde variables de entorno.
product.service.url=${PRODUCT_SERVICE_URL:https://gestopago.portalventas.net}
product.service.bearer-token=${PRODUCT_SERVICE_BEARER_TOKEN:}
product.service.api-key=${PRODUCT_SERVICE_API_KEY:}
product.service.failure-cooldown=${PRODUCT_SERVICE_FAILURE_COOLDOWN:30s}

spring.cloud.openfeign.client.config.productCatalogClient.connectTimeout=${PRODUCT_SERVICE_CONNECT_TIMEOUT_MS:5000}
spring.cloud.openfeign.client.config.productCatalogClient.readTimeout=${PRODUCT_SERVICE_READ_TIMEOUT_MS:10000}
spring.cloud.openfeign.client.config.productCatalogClient.loggerLevel=basic

# Sincronizacion diaria y cache del catalogo.
product.cache.key=${PRODUCT_CACHE_KEY:gestopago:products:v1}
product.cache.ttl=${PRODUCT_CACHE_TTL:26h}
product.sync.cron=${PRODUCT_SYNC_CRON:0 0 2 * * *}
product.sync.zone=${PRODUCT_SYNC_ZONE:America/Mexico_City}
product.sync.temp-directory=${PRODUCT_SYNC_TEMP_DIRECTORY:./data/gestopago-sync}

# Respuestas grandes: reduce transferencia y latencia bajo carga.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/xml,text/plain

api.documentation.server-url=${API_DOCUMENTATION_SERVER_URL:http://localhost:8080}

# Autenticacion de usuarios. En produccion AUTH_JWT_SECRET debe tener al menos 32 caracteres.
# Si se deja vacio, se genera una llave temporal segura al iniciar (solo conveniente para desarrollo).
auth.jwt.secret=${AUTH_JWT_SECRET:}
auth.jwt.issuer=${AUTH_JWT_ISSUER:prueba-api}
auth.jwt.expiration=${AUTH_JWT_EXPIRATION:8h}
auth.cache.user-prefix=${AUTH_CACHE_USER_PREFIX:auth:user:email:}
auth.cache.session-prefix=${AUTH_CACHE_SESSION_PREFIX:auth:session:}
auth.cache.user-ttl=${AUTH_CACHE_USER_TTL:7d}
