# Instalacion inicial opt-in. Nunca usar con la base existente V1..V16.
# Variable obligatoria y separada: no usar Database-1 como destino por defecto.
app.database.enabled=true
spring.datasource.url=${NEW_DATABASE_JDBC_URL}
spring.flyway.locations=classpath:db/initial
spring.flyway.baseline-on-migrate=false
