# Exclusivo para Render. No carga application-local.properties ni datos locales.
server.address=0.0.0.0
server.port=${PORT:10000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.cloud.config.enabled=false

app.database.enabled=true
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Render parte de una base vacia. Para una restauracion V1..V16 usar db/migration.
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/initial}
spring.flyway.baseline-on-migrate=false

# La URL interna de Key Value incluye host/puerto y, si procede, autenticacion/TLS.
spring.data.redis.url=${REDIS_URL}
auth.jwt.secret=${AUTH_JWT_SECRET}
# Renovacion bajo demanda: no depende del cron mientras Render esta suspendido.
gestopago.auth.enabled=${GESTOPAGO_AUTH_ENABLED:true}
api.documentation.server-url=${API_DOCUMENTATION_SERVER_URL:${RENDER_EXTERNAL_URL}}
product.sync.temp-directory=/tmp/gestopago-sync

# Redis es un fallback: su caida no debe sacar del servicio una API con PostgreSQL disponible.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false

# Activar solo durante la creacion inicial; retirar la contrasena despues.
auth.bootstrap-executive.enabled=${BOOTSTRAP_EXECUTIVE_ENABLED:false}
auth.bootstrap-executive.email=${BOOTSTRAP_EXECUTIVE_EMAIL:}
auth.bootstrap-executive.password=${BOOTSTRAP_EXECUTIVE_PASSWORD:}
